name: blind_nav
description: A blind navigation app project.
publish_to: 'none'
version: 1.0.0+1

# ВОТ ЭТОГО БЛОКА НЕ ХВАТАЛО:
environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  
  # Основные библиотеки
  camera: ^0.11.0
  permission_handler: ^11.0.0
  cupertino_icons: ^1.0.8
  flutter_tts: ^3.8.3
  vibration: ^3.1.0
  ultralytics_yolo: ^0.2.0
  geolocator: ^11.0.0
  geocoding: ^2.1.0
  flutter_compass: ^0.8.0
  speech_to_text: ^7.3.0
  http: ^1.2.0
  google_mlkit_text_recognition: ^0.13.0
  audioplayers: ^6.0.0
  url_launcher: ^6.2.5
  path_provider: ^2.1.2
  flutter_dotenv: ^5.1.0
  
  # Phase 6: Volunteer System
  agora_rtc_engine: ^6.3.0
  firebase_core: ^2.24.2
  firebase_database: ^10.4.0
  
  # Phase 7: Accessibility
  volume_controller: ^2.0.7
  sensors_plus: ^6.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  
  # Файлы модели (проверь, что они лежат в папке assets/ml/)
  assets:
    - assets/ml/model.tflite
    - assets/ml/labels.txt
    - .env